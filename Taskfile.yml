version: '3'

silent: true

dotenv: ['autoinstall/.env']

tasks:

  # ── Entry point ─────────────────────────────────────────────────────────────
  default:
    desc: "全流程：安裝相依套件 → 初始化 .env → 產出 seed.iso"
    cmds:
      - task: _install-python3
      - task: _install-iso-tool
      - task: init
      - task: seed-iso

  # ── 初始化 .env ─────────────────────────────────────────────────────────────
  init:
    desc: "複製 autoinstall/.env.example → autoinstall/.env（已存在則略過）"
    dir: autoinstall
    cmds:
      - |
        if [ ! -f .env ]; then
          cp .env.example .env
          echo ""
          echo "┌─────────────────────────────────────────────────────────┐"
          echo "│  .env 已建立，請填入以下必填欄位後再次執行 task         │"
          echo "│                                                         │"
          echo "│  vim autoinstall/.env                                   │"
          echo "│                                                         │"
          echo "│  必填：STATIC_IP / GATEWAY / DNS                       │"
          echo "│         SENTRY_DOMAIN                                   │"
          echo "│         ADMIN_EMAIL / ADMIN_PASSWORD                    │"
          echo "└─────────────────────────────────────────────────────────┘"
          echo ""
          exit 1
        else
          echo ".env 已存在，略過。"
        fi

  # ── 產生並匯入 SSH Public Key ────────────────────────────────────────────────
  generate-ssh-key:
    desc: "產生 SSH key（若不存在）並複製 public key 到 cert/"
    cmds:
      - |
          KEY=~/.ssh/sentry_server_key
          CERT=cert/sentry_server_key.pub

          # 產生 key（若不存在）
          if [ ! -f "$KEY" ]; then
            echo "找不到 sentry_server_key，自動產生 ed25519 key pair..."
            ssh-keygen -t ed25519 -N "" -f "$KEY"
          fi

          # 若 cert/ 已有不同的 key，警告使用者
          if [ -f "$CERT" ] && ! diff -q "${KEY}.pub" "$CERT" > /dev/null 2>&1; then
            echo "WARNING: cert/ 已有不同的 public key，即將覆蓋"
            echo "  舊：$(ssh-keygen -l -f "$CERT")"
            echo "  新：$(ssh-keygen -l -f "${KEY}.pub")"
            echo "  若 VM 已用舊 key 安裝，請重新產出 seed.iso 並重灌"
          fi

          cp "${KEY}.pub" "$CERT"
          echo "已同步 public key → $CERT"
          echo "連線指令："
          echo "  ssh -i ~/.ssh/sentry_server_key -p ${SSH_PORT:-2222} ubuntu@${STATIC_IP%%/*}"

  # ── 驗證 user-data ──────────────────────────────────────────────────────────
  validate:
    desc: "產出 user-data 並驗證 YAML 語法、無殘留 placeholder"
    dir: autoinstall
    cmds:
      - bash generate.sh
      - python3 -c "import yaml, sys; yaml.safe_load(open('user-data')); print('YAML OK')"
      - |
        if grep -oE '__[A-Z_]+__' user-data; then
          echo "ERROR: 上方有未替換的 placeholder"
          exit 1
        else
          echo "Placeholder OK"
        fi

  # ── 最終目標 ────────────────────────────────────────────────────────────────
  seed-iso:
    desc: "讀取 autoinstall/.env → 產出 user-data → 打包 autoinstall/seed.iso"
    dir: autoinstall
    cmds:
      - task: validate
      - bash build-seed-iso.sh

  # ── QEMU 本機測試靶場 ───────────────────────────────────────────────────────
  test:
    desc: "QEMU 本機跑完整 Ubuntu autoinstall 測試（需先把 Ubuntu ISO 放在 repo 根目錄）"
    cmds:
      - task: validate
      - task: _install-qemu
      - |
        ISO="${UBUNTU_ISO:-ubuntu-24.04.4-live-server-amd64.iso}"
        if [ ! -f "$ISO" ]; then
          echo "ERROR: 找不到 $ISO"
          echo "       請先下載放到 repo 根目錄：https://ubuntu.com/download/server"
          exit 1
        fi
        # 從 ISO 抽出 kernel + initrd，讓我們能直接附加 autoinstall 參數
        BOOT_DIR=/tmp/sentry-test-boot
        mkdir -p "$BOOT_DIR"
        if [ ! -f "$BOOT_DIR/vmlinuz" ]; then
          echo "從 ISO 抽出 kernel..."
          7z e "$ISO" casper/vmlinuz casper/initrd -o"$BOOT_DIR" -y > /dev/null
        fi

        DISK=/tmp/sentry-test.qcow2
        rm -f "$DISK"
        qemu-img create -f qcow2 "$DISK" 40G

        KVM_FLAG=""
        if [ -w /dev/kvm ]; then
          KVM_FLAG="-enable-kvm -cpu host"
          echo "KVM 加速已啟用，安裝約 5~10 分鐘"
        else
          echo "警告：KVM 不可用，純軟體模擬會非常慢"
        fi
        echo "安裝完成後 VM 會自動關機，task 結束即代表成功"
        echo "即時 log：tail -f /tmp/sentry-test-install.log"
        qemu-system-x86_64 \
          $KVM_FLAG \
          -m 4096 -smp 2 \
          -kernel "$BOOT_DIR/vmlinuz" \
          -initrd "$BOOT_DIR/initrd" \
          -append "autoinstall console=ttyS0,115200n8 quiet ---" \
          -drive "file=$ISO,media=cdrom,index=0,readonly=on" \
          -drive "file=autoinstall/seed.iso,media=cdrom,index=1,readonly=on" \
          -drive "file=$DISK,format=qcow2,index=2" \
          -nographic \
          -serial file:/tmp/sentry-test-install.log
        echo ""
        echo "=== 最後 20 行安裝 log ==="
        tail -20 /tmp/sentry-test-install.log

  # ── 信任自簽憑證 ────────────────────────────────────────────────────────────
  trust-cert:
    desc: "下載 Sentry 自簽憑證並加入本機信任清單（需要 sudo）"
    cmds:
      - |
        IP="${STATIC_IP%%/*}"
        DOMAIN="${SENTRY_DOMAIN}"
        CERT_FILE="/usr/local/share/ca-certificates/sentry-local.crt"
        echo "從 $IP (SNI: $DOMAIN) 下載憑證..."
        openssl s_client -connect "${IP}:443" -servername "$DOMAIN" </dev/null 2>/dev/null \
          | openssl x509 -outform PEM \
          | sudo tee "$CERT_FILE" > /dev/null
        sudo update-ca-certificates
        echo "憑證已加入信任清單：$CERT_FILE"

  # ── Internal tasks ──────────────────────────────────────────────────────────

  _install-qemu:
    internal: true
    status:
      - command -v qemu-system-x86_64
    cmds:
      - cmd: sudo apt-get install -y qemu-system-x86 p7zip-full
        platforms: [linux]
      - cmd: brew install qemu p7zip
        platforms: [darwin]

  _install-gum:
    internal: true
    status:
      - command -v gum
    cmds:
      - |
        sudo mkdir -p /etc/apt/keyrings
        curl -fsSL https://repo.charm.sh/apt/gpg.key \
          | sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg
        echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" \
          | sudo tee /etc/apt/sources.list.d/charm.list > /dev/null
        sudo apt-get update -y && sudo apt-get install -y gum

  _install-python3:
    internal: true
    status:
      - command -v python3
    cmds:
      - cmd: sudo apt-get install -y python3
        platforms: [linux]
      - cmd: brew install python3
        platforms: [darwin]

  _install-iso-tool:
    internal: true
    status:
      - command -v genisoimage || command -v mkisofs || command -v xorriso
    cmds:
      - cmd: sudo apt-get update -y && sudo apt-get install -y genisoimage
        platforms: [linux]
      - cmd: brew install xorriso
        platforms: [darwin]
